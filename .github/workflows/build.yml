name: Build Mush iOS & Metal Shaders

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: '上游源码仓库'
        required: true
        default: 'c22dev/mush8'
      source_ref:
        description: '分支或 Commit Hash'
        required: true
        default: 'main'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: 1. 检出当前构建脚本仓库
        uses: actions/checkout@v4

      - name: 2. 检出目标 Mush 源码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: 'src'
          submodules: 'recursive'

      - name: 3. 安装并配置 Rust 工具链 (iOS 交叉编译目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 4. 配置 Xcode 环境
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: 5. 编译 Rust 项目与 iOS App
        run: |
          cd src
          chmod +x ./make-ios.sh ./build.sh || true
          
          # 1. 设置环境变量绕过签名和 Team ID 限制
          export TEAM="UNSIGNED"
          export CODE_SIGN_IDENTITY=""
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGNING_ALLOWED=NO
          export AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          # 2. 在常见路径放置虚拟 prod.keys，防止脚本因找不到密钥抛出 Error 2
          mkdir -p ~/.switch $HOME/.switch ./
          touch ./prod.keys
          touch ~/.switch/prod.keys
          touch $HOME/.switch/prod.keys
          
          # 3. 运行构建脚本，并加入 || true 容错，防止因缺失真实 key 阻断流程
          if [ -f "./make-ios.sh" ]; then
            echo "=== 执行 ./make-ios.sh ==="
            TEAM="UNSIGNED" ./make-ios.sh || true
          elif [ -f "./build.sh" ]; then
            echo "=== 执行 ./build.sh ==="
            ./build.sh || true
          else
            echo "=== 执行 cargo build 交叉编译 ==="
            cargo build --release --target aarch64-apple-ios
          fi
          
          # 4. 打印检查产物
          echo "=== 检查是否已生成 .app 应用目录 ==="
          find . -name "*.app" -type d

      - name: 6. 打包无证书 IPA 包
        run: |
          cd src
          echo "=== 搜寻构建产物并打包为 IPA ==="
          mkdir -p Payload
          
          # 查找生成的 .app 文件夹并放入 Payload 文件夹
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
            zip -r ../Mush-Unsigned.ipa Payload
            cd ..
            shasum -a 256 Mush-Unsigned.ipa > SHA256SUMS.txt
            echo "打包成功：Mush-Unsigned.ipa"
          else
            echo "错误：未找到编译输出的 .app 目录！"
            exit 1
          fi

      - name: 7. 发布编译产物至 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_number }}
          name: Mush Build #${{ github.run_number }}
          files: |
            Mush-Unsigned.ipa
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
